name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: investpro_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        working-directory: ./backend
        run: chmod +x gradlew

      - name: Verify Docker availability
        run: |
          echo "Docker version:"
          docker version
          echo "Docker info:"
          docker info --format '{{.ServerVersion}}'

      - name: Build and test with Gradle
        working-directory: ./backend
        run: ./gradlew clean build --info
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'
          CI: 'true'
          SPRING_PROFILES_ACTIVE: 'ci'
          SPRING_DATASOURCE_URL: 'jdbc:postgresql://localhost:5432/investpro_test'
          SPRING_DATASOURCE_USERNAME: 'test'
          SPRING_DATASOURCE_PASSWORD: 'test'
          # Testcontainers Docker configuration
          # Set Docker API version to match the CI runner's Docker server
          DOCKER_API_VERSION: '1.44'
          # Disable Ryuk container (cleanup) in CI for better reliability
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Publish test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/test/
          retention-days: 7

      - name: Check build artifacts
        working-directory: ./backend
        run: |
          echo "Build completed successfully!"
          ls -lh build/libs/*.jar || echo "No JAR files found"
