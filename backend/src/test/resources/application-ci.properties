# CI Test Profile (GitHub Actions, GitLab CI, etc.)
# Uses Testcontainers to automatically spin up PostgreSQL containers
# No manual service configuration needed

spring.application.name=InvestPro Backend Test

# Database configuration is provided by PostgresIntegrationTest via DynamicPropertySource
# Testcontainers will handle PostgreSQL container creation and management

# JPA / Hibernate - Validate schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway - Run migrations with safety
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# JWT (test values only)
app.jwt.secret=dGVzdF9zZWNyZXRfa2V5X2Zvcl9DSV90ZXN0c19vbmx5X2RvX25vdF91c2VfaW5fcHJvZHVjdGlvbg==
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# CORS configuration for tests
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Logging for CI/CD debugging
logging.level.root=WARN
logging.level.ma.investpro=INFO
logging.level.org.springframework.test=INFO
logging.level.org.flywaydb=INFO
logging.level.org.testcontainers=INFO
