# CI Test Profile - Uses GitHub Actions PostgreSQL service instead of Testcontainers
spring.application.name=InvestPro Backend Test

# Database - Use GitHub Actions service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investpro_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:test}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Validate schema
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway - Run migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# JWT (test values)
app.jwt.secret=dGVzdF9zZWNyZXRfa2V5X2Zvcl9DSV90ZXN0c19vbmx5X2RvX25vdF91c2VfaW5fcHJvZHVjdGlvbg==
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Logging
logging.level.root=INFO
logging.level.ma.investpro=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.flywaydb=DEBUG
