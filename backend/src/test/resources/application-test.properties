# Test Configuration - Overridden by Testcontainers in integration tests
# Minimal configuration for unit tests

# Application Configuration
app.jwt.secret=dGVzdF9zZWNyZXRfa2V5X3RvX2JlX2NoYW5nZWRfaW5fcHJvZHVjdGlvbg==
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Logging
logging.level.root=WARN
logging.level.ma.investpro=INFO

# Disable Spring Boot DevTools for tests
spring.devtools.restart.enabled=false

# JPA - Will be overridden by Testcontainers tests
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security - Disable for tests
spring.security.enabled=false

# Disable unnecessary autoconfiguration for tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
